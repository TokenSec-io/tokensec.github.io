<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact | TokenSec</title>
<meta name="description" content="Contact TokenSec. Level 2, 696 Bourke St, Melbourne VIC 3000. Phone 1800 931 678.">
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="branding/tokens.css">
<style>
  body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; background: var(--paper); color: var(--ink); font-family: var(--font-sans); -webkit-font-smoothing: antialiased; }
  .wrap { width: 100%; max-width: 1200px; margin: 0 auto; box-sizing: border-box; padding-inline: var(--space-4); }
  @media (min-width: 720px) { .wrap { padding-inline: var(--space-8); } }

  header { border-bottom: 1px solid var(--line); }
  header .wrap { display: flex; align-items: center; justify-content: space-between; gap: var(--space-4); min-height: 72px; }
  nav { display: flex; gap: var(--space-2); }
  nav a { color: var(--ink); text-decoration: none; border-radius: var(--radius-sm); padding: var(--space-2); }
  nav a:hover { color: var(--link); }
  nav a[aria-current="page"] { color: var(--ledger); }
  nav a:focus-visible { outline: 2px solid transparent; box-shadow: var(--focus-ring); }
  .logo { display: inline-flex; align-items: center; gap: var(--space-3); color: var(--ink); text-decoration: none; border-radius: var(--radius-sm); }
  .logo:focus-visible { outline: 2px solid transparent; box-shadow: var(--focus-ring); }
  .logo svg { width: 32px; height: 32px; flex: none; }
  .logo .tile { fill: var(--ledger); }
  .logo .tile-held { fill: var(--seal-fill); }
  .wordmark { font-size: 24px; line-height: 1; font-weight: 600; letter-spacing: -0.01em; }
  .wordmark span { color: var(--ledger); }

  main { flex: 1; display: flex; align-items: center; }
  main .wrap { padding-block: var(--space-16); display: grid; gap: var(--space-6); }
  .eyebrow { margin: 0; color: var(--ink-muted); }
  h1 { margin: 0; max-width: 18ch; text-wrap: balance; }
  .lede { margin: 0; max-width: 60ch; color: var(--ink); }
  @media (max-width: 600px) { h1.ts-display { font-size: 34px; line-height: 42px; } }

  .details { display: grid; gap: var(--space-6); margin: var(--space-6) 0 0; grid-template-columns: 1fr; }
  @media (min-width: 720px) { .details { grid-template-columns: repeat(2, minmax(0, 320px)); } }
  .details div { border-top: 1px solid var(--line); padding-top: var(--space-4); }
  .details dt { margin: 0 0 var(--space-2); color: var(--ink-muted); }
  .details dd { margin: 0; }
  .details address { font-style: normal; }
  .details a { color: var(--link); }

  footer { border-top: 1px solid var(--line); }
  footer .wrap { padding-block: var(--space-6); color: var(--ink-muted); }
  footer p { margin: 0; }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <a class="logo" href="/" aria-label="TokenSec home">
      <svg viewBox="0 0 100 100" aria-hidden="true">
        <rect class="tile" x="0" y="0" width="28" height="28" rx="3"/><rect class="tile" x="36" y="0" width="28" height="28" rx="3"/><rect class="tile-held" x="72" y="0" width="28" height="28" rx="3"/>
        <rect class="tile" x="0" y="36" width="28" height="28" rx="3"/><rect class="tile" x="36" y="36" width="28" height="28" rx="3"/><rect class="tile" x="72" y="36" width="28" height="28" rx="3"/>
        <rect class="tile" x="0" y="72" width="28" height="28" rx="3"/><rect class="tile" x="36" y="72" width="28" height="28" rx="3"/><rect class="tile" x="72" y="72" width="28" height="28" rx="3"/>
      </svg>
      <span class="wordmark">Token<span>Sec</span></span>
    </a>
    <nav aria-label="Main"><a class="ts-body" href="/uses.html">Uses</a><a class="ts-body" href="/contact.html" aria-current="page">Contact</a></nav>
  </div>
</header>

<main>
  <div class="wrap">
    <p class="eyebrow ts-label">Contact</p>
    <h1 class="ts-display">Get in touch</h1>
    <dl class="details ts-body">
      <div>
        <dt class="ts-label">Office</dt>
        <dd><address>Level 2, 696 Bourke St<br>Melbourne VIC 3000<br>Australia</address></dd>
      </div>
      <div>
        <dt class="ts-label">Phone</dt>
        <dd><a href="tel:1800931678">1800 931 678</a><br><span class="ts-small">Free call within Australia</span></dd>
      </div>
    </dl>
  </div>
</main>

<footer>
  <div class="wrap">
    <p class="ts-small">TokenSec is a CoinPort business.</p>
  </div>
</footer>
</body>
</html>
