<!-- @dsCard group="Offerings" height=600 -->
<!doctype html>
<html lang="en-AU">
<head><meta charset="utf-8"><title>OfferingCard</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap"></head>
<body>
<div class="ts-stage">
<article class="ts-card" aria-labelledby="oc-title">
  <header class="ts-card-head">
    <div class="ts-card-tags">
      <span class="ts-tag ts-tag-debt">Senior secured notes</span>
      <span class="ts-tag ts-tag-eligibility">Wholesale only</span>
    </div>
    <p class="ts-card-issuer">Harbour Logistics Pty Ltd (example)</p>
    <h2 class="ts-card-title" id="oc-title">Warehouse expansion notes 2029</h2>
  </header>
  <dl class="ts-terms">
    <div><dt>Coupon</dt><dd>8.50% p.a.</dd></div>
    <div><dt>Paid</dt><dd>Quarterly</dd></div>
    <div><dt>Term</dt><dd>3 years</dd></div>
    <div><dt>Minimum</dt><dd>A$10,000</dd></div>
    <div><dt>Unit</dt><dd>1 note = A$1,000</dd></div>
    <div><dt>Closes</dt><dd>14 Nov 2026</dd></div>
  </dl>
  <div class="ts-progress">
    <div class="ts-progress-figures"><span class="ts-figure">A$2,800,000</span><span class="ts-progress-of">of A$4,000,000 raised</span></div>
    <div class="ts-units" role="img" aria-label="70% of notes allocated">
      <span class="on"></span><span class="on"></span><span class="on"></span><span class="on"></span><span class="on"></span><span class="on"></span><span class="on"></span><span class="on"></span><span class="on"></span><span class="on"></span><span class="on"></span><span class="on"></span><span class="on"></span><span class="on"></span><span></span><span></span><span></span><span></span><span></span><span></span>
    </div>
  </div>
  <footer class="ts-card-foot">
    <span class="ts-id">ISIN AU0000HRBL01</span>
    <button class="ts-btn ts-btn-primary" type="button">View offer</button>
  </footer>
</article>
</div>
</body>
</html>
